services:
  mongodb:
    image: mongo:7.0-jammy
    container_name: apc-mongodb-container
    restart: always
    ports:
      - "${MONGO_PORT}:${DOCKER_MONGO_PORT}"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - /var/lib/mongodb/data:/data/db

  backend:
    container_name: apc-backend-container
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    # environment:
      # LƯU Ý: Trong môi trường Docker, thay 'localhost' bằng tên service 'mongodb-standard'
      # MONGO_URI: mongodb://root:rootpw@mongodb-standard:9265/affiliate-product-catalog?authSource=admin
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend: # Môi trường Product cho Frontend
    container_name: apc-frontend-container
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production # Bỏ qua stage 2, chạy các stage còn lại
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
        - NEXT_PUBLIC_SOCKET_PATH=${NEXT_PUBLIC_SOCKET_PATH}
        - NODE_ENV=production
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    env_file:
      - .env.production # Tự động nạp toàn bộ biến từ file .env.production vào hệ thống
    environment:
      - PORT=${FRONTEND_PORT}
    restart: always
    depends_on:
      - backend

  admin:
    container_name: apc-admin-container
    build:
      context: ./admin
      dockerfile: Dockerfile
      target: production 
    ports:
      - "${ADMIN_PORT}:80"
    env_file:
      - .env.production
    restart: always
    depends_on:
      - backend

volumes:
  custom_data: