services:
  mongodb:
    image: mongo:7.0
    container_name: apc-mongodb-container
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT}:${DOCKER_MONGO_PORT}"
    volumes:
      - apc_data:/data/db
    healthcheck:
      test: echo 'db.runCommand({ping:1})' | mongosh localhost:${DOCKER_MONGO_PORT}/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  db-seeder:
    container_name: apc-seeder-container
    build:
      context: ./data
      dockerfile: Dockerfile
    env_file:
      - .env.development
    environment:
      - DB_MODE=${DB_MODE}
      - MONGO_PORT=${DOCKER_MONGO_PORT}
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - ./data:/app
      - /app/node_modules
    network_mode: "service:mongodb"
    depends_on:
      mongodb:
        condition: service_healthy

  backend:
    container_name: apc-backend-container
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    env_file:
      - .env.development
    environment:
      - PORT=${BACKEND_PORT}
      - MONGODB_URI=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:${DOCKER_MONGO_PORT}/affiliate-product-catalog?authSource=admin
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    container_name: apc-frontend-container
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development # Chỉ định dừng lại ở stage development trong Dockerfile
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    env_file:
      - .env.development
    environment:
      - PORT=${FRONTEND_PORT}
      - WATCHPACK_POLLING=true # Giúp hot-reload mượt trên mọi OS (Windows/WSL2/Mac)
    command: npm run dev -- -p ${FRONTEND_PORT}
    volumes:
      - ./frontend:/app # Đồng bộ code để hot-reload
      - /app/node_modules # Cô lập node_modules trong docker, tránh xung đột cấu hình máy thật
      - /app/.next # Giữ cache Next.js độc lập để tăng tốc độ tải trang lúc dev
    restart: unless-stopped
    depends_on:
      - backend

  admin:
    container_name: apc-admin-container
    build:
      context: ./admin
      dockerfile: Dockerfile
      target: development
    ports:
      - "${ADMIN_PORT}:${ADMIN_PORT}"
    env_file:
      - .env.development
    environment:
      - PORT=${ADMIN_PORT}
      - VITE_PORT=${ADMIN_PORT}
    command: npm run dev -- --host 0.0.0.0 --port ${ADMIN_PORT}
    volumes:
      - ./admin:/app # Đồng bộ code từ máy thật vào container để hot-reload
      - /app/node_modules # Giữ node_modules độc lập trong container, tránh xung đột
      - /app/node_modules/.vite # Cô lập riêng cache optimize của Vite Compiler
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  apc_data: