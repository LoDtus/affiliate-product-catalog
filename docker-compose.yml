services:
  # Database
  mongodb-dev:
    image: mongo:latest
    container_name: apc-mongodb-dev-container
    profiles: ["dev"]
    ports:
      - "${DOCKER_DEV_MONGO_PORT}:${DOCKER_CONTAINER_MONGO_PORT}"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DOCKER_DEV_MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DOCKER_DEV_MONGO_PASSWORD}
    volumes:
      - mongodb_dev_data:/data/db

  mongodb-prod:
    image: mongo:7.0-jammy
    container_name: apc-mongodb-prod-container
    profiles: ["prod"]
    restart: always
    ports:
      - "${DOCKER_PROD_MONGO_PORT}:${DOCKER_CONTAINER_MONGO_PORT}"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DOCKER_PROD_MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DOCKER_PROD_MONGO_PASSWORD}
    volumes:
      - /var/lib/mongodb/data:/data/db

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apc-backend-container
    ports:
      - "${DOCKER_BACKEND_PORT}:${DOCKER_BACKEND_PORT}"
    # environment:
      # LƯU Ý: Trong môi trường Docker, thay 'localhost' bằng tên service 'mongodb-standard'
      # MONGO_URI: mongodb://root:rootpw@mongodb-standard:9265/affiliate-product-catalog?authSource=admin
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb-standard
    restart: unless-stopped

  # Frontend
  frontend-dev: # Môi trường Dev cho Frontend
    container_name: apc-frontend-dev-container
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development # Chỉ định dừng lại ở tầng development trong Dockerfile
    ports:
      - "${DOCKER_FRONTEND_PORT}:${DOCKER_FRONTEND_PORT}"
    env_file: # Tự động nạp toàn bộ biến từ file .env.development vào hệ thống
      - ./frontend/.env.development
    volumes:
      - ./frontend:/app # Đồng bộ code để hot-reload
      - /app/node_modules # Giữ node_modules độc lập trong container, tránh xung đột cấu hình máy thật
      - /app/.next # Giữ cache Next.js độc lập để tăng tốc độ tải trang lúc dev
    restart: unless-stopped
    depends_on:
      - backend

  frontend-prod: # Môi trường Product cho Frontend
    container_name: apc-frontend-prod-container
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production # Bỏ qua stage 2, chạy các stage còn lại
    ports:
      - "${DOCKER_FRONTEND_PORT}:${DOCKER_FRONTEND_PORT}"
    env_file:
      - ./frontend/.env.production # Tự động nạp toàn bộ biến từ file .env.production vào hệ thống
    restart: always
    depends_on:
      - backend

  # Admin
  admin-dev:
    container_name: apc-admin-dev-container
    profiles: ["dev"]
    build:
      context: ./admin
      dockerfile: Dockerfile
      target: development
    ports:
      - "${DOCKER_ADMIN_PORT}:${DOCKER_ADMIN_PORT}"
    env_file:
      - .env.development
    volumes:
      - .:/app # Đồng bộ code từ máy thật vào container để hot-reload
      - /app/node_modules # Giữ node_modules độc lập trong container, tránh xung đột
      - /app/.vite_cache # Giữ cache Vite độc lập để tăng tốc độ compile
    restart: unless-stopped
    depends_on:
      - backend

  admin-prod:
    container_name: apc-admin-prod-container
    profiles: ["prod"]
    build:
      context: ./admin
      dockerfile: Dockerfile
      target: production 
    ports:
      - "${DOCKER_ADMIN_PORT}:80"
    env_file:
      - .env.production
    restart: always
    depends_on:
      - backend

volumes:
  custom_data: