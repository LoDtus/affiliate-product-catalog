server {
    listen 80;
    server_name localhost;

    # Thư mục chứa các file tĩnh sau khi build (copy từ stage builder sang)
    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        # Kiểm tra nếu đường dẫn là file ($uri) hoặc thư mục ($uri/) có tồn tại không.
        # Nếu KHÔNG tồn tại (ví dụ user vào /dashboard, /profile), ép Nginx trả về index.html.
        # Từ đó React Router phía Client mới có thể đọc URL và điều hướng giao diện.
        try_files $uri $uri/ /index.html;
    }

    # Tối ưu tốc độ tải trang (Gzip Compression)
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5; # Mức độ nén vừa đủ (từ 1-9), cân bằng giữa dung lượng và CPU
    gzip_min_length 256; # Chỉ nén các file có dung lượng trên 256 bytes
    
    # Các định dạng file tĩnh được phép nén mạnh để giảm dung lượng băng thông
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/plain
        text/javascript
        text/xml
        image/svg+xml;

    # Cache Assets tĩnh (Tăng tốc load từ lần thứ 2)
    # Vite luôn sinh ra các file kèm mã hash ở tên (Ví dụ: index-CH82j1A.js) khi build.
    location /assets/ {
        expires 3M;
        add_header Cache-Control "public, immutable, no-transform";
    }

    # Không cache file index.html và các file cấu hình hệ thống
    # Để đảm bảo khi bạn deploy phiên bản mới, người dùng luôn nhận được file index.html mới nhất lập tức.
    location ~* \.(?:html|json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Xử lý lỗi hệ thống. Chạy ở tầng Web Server, không chạy ở tầng Application (Tùy chọn)
    error_page 5xx /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        # Đảm bảo file này không bị cache để nếu có sửa giao diện lỗi thì cập nhật ngay
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}